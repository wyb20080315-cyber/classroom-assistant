<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂助手 | Classroom Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
  <div id="setup-overlay" class="overlay hidden">
    <div class="setup-modal">
      <h1>🎓 课堂助手</h1>
      <p class="setup-desc">首次使用请配置你的大模型 API 和谷歌账号信息。</p>
      <form id="setup-form">
        <div class="form-group">
          <label for="api-base-url">API Base URL</label>
          <input type="url" id="api-base-url" placeholder="https://你的中转站地址/v1" required>
        </div>
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-..." required>
        </div>
        <div class="form-group">
          <label for="model-name">Model 名称</label>
          <input type="text" id="model-name" placeholder="deepseek-chat / gpt-4o-mini" required>
        </div>
        <div class="form-group">
          <label for="google-client-id">Google Client ID</label>
          <input type="text" id="google-client-id" placeholder="从 Google Cloud Console 获取" required>
          <small>用于登录和云盘存储，不会泄露你的密码</small>
        </div>
        <div class="form-group toggle-group">
          <label for="use-custom-translate">使用自定义模型进行实时翻译</label>
          <label class="switch">
            <input type="checkbox" id="use-custom-translate">
            <span class="slider"></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-large">保存并开始使用</button>
      </form>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="setup-modal">
      <h2>⚙️ 设置</h2>
      <form id="settings-form">
        <div class="form-group">
          <label for="set-api-base-url">API Base URL</label>
          <input type="url" id="set-api-base-url" required>
        </div>
        <div class="form-group">
          <label for="set-api-key">API Key</label>
          <input type="password" id="set-api-key" required>
        </div>
        <div class="form-group">
          <label for="set-model-name">Model 名称</label>
          <input type="text" id="set-model-name" required>
        </div>
        <div class="form-group">
          <label for="set-google-client-id">Google Client ID</label>
          <input type="text" id="set-google-client-id" required>
        </div>
        <div class="form-group toggle-group">
          <label for="set-use-custom-translate">使用自定义模型进行实时翻译</label>
          <label class="switch">
            <input type="checkbox" id="set-use-custom-translate">
            <span class="slider"></span>
          </label>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">保存设置</button>
          <button type="button" id="close-settings" class="btn btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="header-left">
        <h1>🎓 课堂助手</h1>
        <span id="user-info" class="user-info hidden"></span>
      </div>
      <div class="header-right">
        <button id="google-login-btn" class="btn btn-google hidden">🔑 登录 Google</button>
        <button id="settings-btn" class="btn-icon" title="设置">⚙️</button>
      </div>
    </header>

    <section class="section recording-section">
      <div class="status-bar">
        <span id="status-indicator" class="status-dot inactive">就绪</span>
      </div>
      <button id="record-btn" class="btn btn-record">
        <span class="record-icon">🎤</span>
        <span id="record-label">开始录音</span>
      </button>
      <div id="timer" class="timer hidden">00:00</div>
      <div id="save-to-drive-btn-container" class="hidden">
        <button id="save-to-drive-btn" class="btn btn-drive">☁️ 保存到音源库</button>
      </div>
    </section>

    <section class="section transcription-section">
      <div class="section-header">
        <h2>📝 识别文本与翻译</h2>
        <button id="clear-text" class="btn btn-small">清空</button>
      </div>
      <div id="transcript-container" class="transcript-box">
        <p class="placeholder">录音开始后，此处将实时显示英文识别结果与中文翻译...</p>
      </div>
    </section>

    <section id="library-section" class="section library-section hidden">
      <div class="section-header">
        <h2>📚 音源库</h2>
        <span id="library-loading" class="loading-text hidden">加载中...</span>
      </div>
      <div id="library-list"></div>
    </section>

    <section class="section manual-section">
      <h2>✏️ 手动输入 / 库中分析</h2>
      <p class="small-text">粘贴英文文本，或从音源库选择录音进行分析</p>
      <textarea id="manual-text" placeholder="在此粘贴英文课程内容..."></textarea>
    </section>

    <section class="section analyze-section">
      <button id="analyze-btn" class="btn btn-analyze">🔍 发送分析</button>
      <div id="analyze-loading" class="loading hidden">
        <div class="spinner"></div>
        <span>正在分析中，请稍候...</span>
      </div>
    </section>

    <section id="result-section" class="section result-section hidden">
      <div class="section-header">
        <h2>📊 分析结果</h2>
        <button id="copy-result" class="btn btn-small">复制</button>
      </div>
      <div id="analysis-result" class="result-box"></div>
    </section>

    <div id="error-toast" class="toast hidden"></div>
    <footer>
      <p>所有 API 密钥仅保存在你的浏览器本地，不会上传到任何服务器。</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
