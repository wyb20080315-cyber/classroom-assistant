<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂助手 | Classroom Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="setup-overlay" class="overlay hidden">
    <div class="setup-modal">
      <button id="setup-close" class="setup-close">✕</button>
      <h1>🎓 课堂助手</h1>
      <p class="setup-desc">配置大模型 API 以获得翻译和分析功能。<br>如果不配置，将无法使用实时翻译和 AI 分析。</p>
      <form id="setup-form">
        <div class="form-group">
          <label for="api-base-url">API Base URL</label>
          <input type="url" id="api-base-url" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label for="model-name">Model 名称</label>
          <input type="text" id="model-name" placeholder="gpt-4o-mini">
        </div>
        <div class="form-group toggle-group">
          <label for="use-custom-translate">使用自定义模型进行实时翻译</label>
          <label class="switch">
            <input type="checkbox" id="use-custom-translate">
            <span class="slider"></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-large">保存并开始使用</button>
      </form>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="setup-modal">
      <h2>⚙️ 设置</h2>
      <form id="settings-form">
        <div class="form-group">
          <label for="set-api-base-url">API Base URL</label>
          <input type="url" id="set-api-base-url">
        </div>
        <div class="form-group">
          <label for="set-api-key">API Key</label>
          <input type="password" id="set-api-key">
        </div>
        <div class="form-group">
          <label for="set-model-name">Model 名称</label>
          <input type="text" id="set-model-name">
        </div>
        <div class="form-group toggle-group">
          <label for="set-use-custom-translate">使用自定义模型进行实时翻译</label>
          <label class="switch">
            <input type="checkbox" id="set-use-custom-translate">
            <span class="slider"></span>
          </label>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">保存设置</button>
          <button type="button" id="close-settings" class="btn btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>🎓 课堂助手</h1>
      <button id="settings-btn" class="btn-icon" title="设置">⚙️</button>
    </header>

    <section class="section recording-section">
      <div class="status-bar">
        <span id="status-indicator" class="status-dot inactive">就绪</span>
      </div>
      <button id="record-btn" class="btn btn-record">
        <span class="record-icon">🎤</span>
        <span id="record-label">开始录音</span>
      </button>
      <div id="timer" class="timer hidden">00:00</div>
    </section>

    <section id="recordings-section" class="section recordings-section hidden">
      <div class="section-header">
        <h2>📂 录音列表</h2>
      </div>
      <div id="recordings-list"></div>
    </section>

    <section class="section transcription-section">
      <div class="section-header">
        <h2>📝 实时翻译</h2>
        <button id="clear-text" class="btn btn-small">清空</button>
      </div>
      <div id="transcript-container" class="transcript-box">
        <p class="placeholder">录音开始后，此处将实时显示中文翻译字幕...</p>
      </div>
    </section>

    <section class="section analyze-section">
      <h2>🔍 AI 课后分析</h2>
      <p class="small-text">上传电脑中的 MP4 音频文件或 TXT 文档进行 AI 分析</p>
      <div class="file-upload-area">
        <input type="file" id="analysis-file" accept=".mp4,.m4a,.webm,.txt">
        <label for="analysis-file" class="file-upload-label">
          <span class="upload-icon">📂</span>
          <span id="file-name-display">点击选择文件 (支持 MP4/TXT)</span>
        </label>
      </div>
      <button id="analyze-btn" class="btn btn-analyze">开始分析</button>
      <div id="analyze-loading" class="loading hidden">
        <div class="spinner"></div>
        <span>正在分析中，请稍候...</span>
      </div>
    </section>

    <section id="result-section" class="section result-section hidden">
      <div class="section-header">
        <h2>📊 分析结果</h2>
        <button id="copy-result" class="btn btn-small">复制</button>
      </div>
      <div id="analysis-result" class="result-box"></div>
    </section>

    <div id="error-toast" class="toast hidden"></div>
    <footer>
      <p>所有 API 密钥仅保存在你的浏览器本地，不会上传到任何服务器。</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
